<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>前端面试题库</title>
    <style>
      :root {
        --bg: #f4efe5;
        --panel: rgba(255, 251, 245, 0.88);
        --panel-strong: #fffaf1;
        --text: #20302b;
        --muted: #5f6f68;
        --line: rgba(32, 48, 43, 0.12);
        --accent: #0f766e;
        --accent-strong: #115e59;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --highlight: #c7772f;
        --shadow: 0 22px 60px rgba(30, 41, 37, 0.12);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(199, 119, 47, 0.16), transparent 28%),
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.14), transparent 24%),
          linear-gradient(180deg, #f8f1e6 0%, #f1ebdf 42%, #ece7df 100%);
        font-family:
          "Aptos",
          "Segoe UI Variable",
          "HarmonyOS Sans SC",
          "Microsoft YaHei",
          sans-serif;
      }

      .shell {
        width: min(1180px, calc(100vw - 32px));
        margin: 32px auto 48px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 36px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: var(--radius-xl);
        background:
          linear-gradient(135deg, rgba(255, 250, 241, 0.98), rgba(247, 242, 233, 0.9)),
          linear-gradient(120deg, rgba(15, 118, 110, 0.08), rgba(199, 119, 47, 0.06));
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -10% -40% auto;
        width: 320px;
        height: 320px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(15, 118, 110, 0.18), transparent 70%);
        pointer-events: none;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(32px, 4vw, 54px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .hero p {
        max-width: 760px;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.75;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 24px;
        align-items: end;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .stat-card {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.48);
        backdrop-filter: blur(14px);
      }

      .stat-value {
        font-size: 28px;
        font-weight: 800;
        color: var(--accent-strong);
      }

      .stat-label {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        margin: 24px 0 18px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: var(--radius-lg);
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .search-wrap {
        position: relative;
      }

      .search-wrap svg {
        position: absolute;
        top: 50%;
        left: 16px;
        width: 18px;
        height: 18px;
        color: var(--muted);
        transform: translateY(-50%);
      }

      .search-input {
        width: 100%;
        padding: 14px 16px 14px 46px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.84);
        color: var(--text);
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .search-input:focus {
        border-color: rgba(15, 118, 110, 0.45);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
      }

      .count {
        min-width: 128px;
        padding: 12px 16px;
        border-radius: 999px;
        background: rgba(32, 48, 43, 0.05);
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }

      .chip {
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          color 0.18s ease,
          background 0.18s ease,
          box-shadow 0.18s ease;
      }

      .chip:hover {
        transform: translateY(-1px);
        color: var(--accent-strong);
        border-color: rgba(15, 118, 110, 0.25);
      }

      .chip.active {
        background: linear-gradient(135deg, #0f766e, #17635d);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 12px 28px rgba(15, 118, 110, 0.24);
      }

      .board {
        display: grid;
        gap: 14px;
      }

      .empty-state {
        padding: 42px 24px;
        border: 1px dashed rgba(32, 48, 43, 0.16);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.56);
        color: var(--muted);
        text-align: center;
        line-height: 1.8;
      }

      .card {
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: var(--radius-lg);
        background: var(--panel-strong);
        box-shadow: var(--shadow);
      }

      .card-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px 0;
      }

      .tag {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(199, 119, 47, 0.12);
        color: var(--highlight);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .index {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .question-button {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 18px;
        width: 100%;
        padding: 14px 16px 18px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .question-title {
        font-size: 18px;
        font-weight: 800;
        line-height: 1.55;
        letter-spacing: -0.01em;
      }

      .question-meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent-strong);
        transition:
          transform 0.24s ease,
          background 0.24s ease;
      }

      .card.open .arrow {
        transform: rotate(180deg);
        background: rgba(15, 118, 110, 0.18);
      }

      .answer-wrap {
        height: 0;
        overflow: hidden;
        transition: height 0.28s ease;
      }

      .answer {
        padding: 0 16px 18px;
        border-top: 1px solid var(--line);
      }

      .answer h3 {
        margin: 18px 0 10px;
        font-size: 15px;
        color: var(--accent-strong);
      }

      .answer p {
        margin: 0 0 10px;
        line-height: 1.82;
        color: #334741;
      }

      .answer ul {
        margin: 0;
        padding-left: 20px;
        color: #334741;
      }

      .answer li {
        margin-bottom: 8px;
        line-height: 1.75;
      }

      .footer-note {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }

      @media (max-width: 980px) {
        .hero-grid,
        .toolbar {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100vw - 20px, 100%);
          margin: 16px auto 28px;
        }

        .hero {
          padding: 24px;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .question-title {
          font-size: 16px;
        }

        .question-button {
          gap: 10px;
        }

        .arrow {
          width: 36px;
          height: 36px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="hero-grid">
          <div>
            <span class="eyebrow">前端求职题库 · 点击题目展开答案</span>
            <h1>中高级前端面试题<br />展开式手册</h1>
            <p>
              这版题库按真实面试高频主题整理，题目点击后会在下方展开标准答案。你可以先按分类刷，再用搜索框集中练薄弱项。每道题都尽量写成“能直接复述”的版本，方便你边看边练表达。
            </p>
          </div>
          <div class="stats">
            <article class="stat-card">
              <div class="stat-value" id="questionTotal">0</div>
              <div class="stat-label">当前题目总数</div>
            </article>
            <article class="stat-card">
              <div class="stat-value">6</div>
              <div class="stat-label">核心模块分类</div>
            </article>
            <article class="stat-card">
              <div class="stat-value">1</div>
              <div class="stat-label">点击题目，答案在下方展开/折叠</div>
            </article>
          </div>
        </div>
      </section>

      <section class="toolbar">
        <label class="search-wrap" for="searchInput">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M21 21L15.8 15.8M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            />
          </svg>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="搜索关键词：Promise、权限、性能、Vue、BFF..."
          />
        </label>
        <div class="count" id="visibleCount">显示 0 / 0</div>
      </section>

      <section class="chips" id="categoryChips"></section>

      <section class="board" id="questionBoard"></section>

      <p class="footer-note">
        使用建议：先按分类完整刷一遍，再把每道题练到“脱稿也能讲清楚”。如果你想继续扩展成 Vue 专项、React 专项、算法专项，我可以在这个页面里继续往下加。
      </p>
    </main>

    <script>
      const questions = [
        {
          category: "项目表达",
          question: "你怎么做一个 3 分钟的前端自我介绍？",
          summary: "高频开场题，重点不是流水账，而是把你的价值讲清楚。",
          answer: [
            {
              title: "回答结构",
              type: "list",
              items: [
                "先讲年限和主方向，比如 9 年前端经验，长期做企业后台、业务中台或复杂 Web 应用。",
                "再讲你最擅长的能力，例如复杂业务交付、权限体系、组件抽象、性能优化、前后端协作推进。",
                "然后讲 1 到 2 个代表项目，不要展开太多，但要点出业务价值和你的关键动作。",
                "最后讲你现在找工作的方向，比如资深前端、前端偏全栈、AI 应用前端。"
              ]
            },
            {
              title: "答题要点",
              type: "paragraph",
              content:
                "核心不是把技术栈背一遍，而是让面试官在开场 30 秒内知道你适合什么岗位、能解决什么问题、为什么值得继续聊下去。"
            }
          ]
        },
        {
          category: "项目表达",
          question: "项目里你怎么讲权限系统，才像做过的人？",
          summary: "B 端中后台面试高频题。",
          answer: [
            {
              title: "标准思路",
              type: "list",
              items: [
                "把权限拆成登录鉴权、路由权限、菜单权限、按钮权限四层来讲。",
                "登录鉴权负责确认用户身份和 token 生命周期。",
                "路由权限决定用户能不能进入某个页面。",
                "菜单权限控制导航展示，但不能只靠菜单隐藏做安全。",
                "按钮权限控制页面内操作能力，通常由后端下发权限码，前端统一封装判断指令或 Hook。"
              ]
            },
            {
              title: "注意点",
              type: "paragraph",
              content:
                "要主动补一句，真正的安全一定以后端校验为准，前端权限更多是用户体验和操作收敛，不能把前端隐藏按钮当成权限防线。"
            }
          ]
        },
        {
          category: "JavaScript",
          question: "事件循环是什么？宏任务和微任务怎么执行？",
          summary: "JS 原理里最容易被反复追问的一题。",
          answer: [
            {
              title: "核心概念",
              type: "paragraph",
              content:
                "JavaScript 主线程一次只做一件事。同步代码先进入调用栈执行，异步任务完成后会进入任务队列，等待主线程空闲后再执行。每一轮事件循环里，主线程会先执行一个宏任务，再清空当前轮次产生的全部微任务，然后才可能进入下一轮宏任务。"
            },
            {
              title: "常见分类",
              type: "list",
              items: [
                "宏任务常见有 script、setTimeout、setInterval、I/O、UI 渲染。",
                "微任务常见有 Promise.then、MutationObserver、queueMicrotask。"
              ]
            },
            {
              title: "面试加分点",
              type: "paragraph",
              content:
                "可以补一句：很多看起来顺序反直觉的问题，本质都是同步代码先执行，然后在当前宏任务结束前把微任务清空，最后再处理下一轮宏任务。"
            }
          ]
        },
        {
          category: "JavaScript",
          question: "闭包是什么？项目里为什么既常用又容易出问题？",
          summary: "这题不要只背定义，重点要讲业务场景。",
          answer: [
            {
              title: "定义",
              type: "paragraph",
              content:
                "闭包本质上是函数和它声明时所在词法作用域的组合。函数即使离开原作用域执行，仍然可以访问那里的变量。"
            },
            {
              title: "常见用途",
              type: "list",
              items: [
                "封装私有变量，比如工厂函数或模块模式。",
                "保存上下文，例如高阶函数、函数柯里化。",
                "事件处理和异步回调里保留外层状态。"
              ]
            },
            {
              title: "常见问题",
              type: "list",
              items: [
                "不必要地持有大对象或 DOM 引用，可能导致内存释放不及时。",
                "循环中配合 var 使用容易拿到意外的最终值。",
                "在 React 或 Vue 中，如果闭包拿的是旧状态，可能出现过期值问题。"
              ]
            }
          ]
        },
        {
          category: "JavaScript",
          question: "Promise 链和 async/await 的关系是什么？面试怎么答更稳？",
          summary: "从语法糖、异常处理、可读性三个角度讲。",
          answer: [
            {
              title: "关系",
              type: "paragraph",
              content:
                "async/await 是基于 Promise 的语法糖，本质上没有脱离 Promise 机制。async 函数会返回一个 Promise，await 会暂停当前 async 函数内部的执行，等待 Promise 结果再继续。"
            },
            {
              title: "对比",
              type: "list",
              items: [
                "Promise.then 更适合链式组合、并发控制、流程编排。",
                "async/await 更适合把异步流程写成接近同步代码，提高可读性。",
                "错误处理上，Promise 常用 catch，async/await 常用 try/catch。"
              ]
            },
            {
              title: "面试注意",
              type: "paragraph",
              content:
                "不要说 async/await 比 Promise 更底层或性能更高。更准确的说法是：它主要改善可读性和维护性，但底层仍然依赖 Promise。"
            }
          ]
        },
        {
          category: "TypeScript",
          question: "interface 和 type 有什么区别？项目里怎么选？",
          summary: "TS 面试基础题，但很能看出你是否真的用过。",
          answer: [
            {
              title: "常见区别",
              type: "list",
              items: [
                "interface 更适合定义对象结构、类契约、可扩展协议。",
                "type 更灵活，可以定义联合类型、交叉类型、元组、字面量类型等。",
                "interface 支持声明合并，type 不支持同名合并。"
              ]
            },
            {
              title: "实践建议",
              type: "paragraph",
              content:
                "如果是接口数据结构、组件 props 形状、类约束，我更倾向用 interface；如果是联合类型、工具类型组合、复杂类型运算，我会用 type。核心不是死规则，而是团队约定一致、可读性清晰。"
            }
          ]
        },
        {
          category: "TypeScript",
          question: "any、unknown、never 分别适合什么场景？",
          summary: "这题经常被拿来判断你的类型意识。",
          answer: [
            {
              title: "解释",
              type: "list",
              items: [
                "any 表示完全放弃类型检查，任何操作都能通过，使用要非常克制。",
                "unknown 表示值类型未知，但在使用前必须先做类型收窄，因此比 any 安全。",
                "never 表示理论上不会出现的值，常见于抛错函数、死循环函数或穷尽判断的兜底分支。"
              ]
            },
            {
              title: "项目建议",
              type: "paragraph",
              content:
                "如果拿到一个外部不可信数据源，优先用 unknown 再配合类型守卫，而不是直接用 any。这样可以把类型安全真正落在边界层。"
            }
          ]
        },
        {
          category: "TypeScript",
          question: "你怎么给请求层做类型约束？",
          summary: "这题很适合 9 年前端讲工程能力。",
          answer: [
            {
              title: "推荐讲法",
              type: "list",
              items: [
                "先定义统一的响应结构，比如 code、message、data。",
                "把请求函数设计成泛型，例如 request<TResponse, TParams>()。",
                "每个接口模块定义自己的入参和出参类型，避免页面层到处写 any。",
                "在业务层只消费已经收敛好的 data 结构，错误码和原始返回统一在请求层处理。"
              ]
            },
            {
              title: "收益",
              type: "paragraph",
              content:
                "这样做能让接口变更更容易被编译器发现，也能提升页面开发的自动提示和重构效率。"
            }
          ]
        },
        {
          category: "浏览器网络",
          question: "从输入 URL 到页面显示，浏览器经历了什么？",
          summary: "网络与浏览器综合题。",
          answer: [
            {
              title: "主流程",
              type: "list",
              items: [
                "先做 URL 解析，判断协议、域名、路径。",
                "查浏览器缓存、系统缓存、DNS 缓存，如果没有再做 DNS 解析。",
                "建立 TCP 连接，HTTPS 还要经历 TLS 握手。",
                "发送 HTTP 请求，服务端返回 HTML。",
                "浏览器解析 HTML 构建 DOM，解析 CSS 构建 CSSOM，再合并成渲染树。",
                "布局计算后进行绘制和合成，页面最终显示出来。",
                "过程中如果遇到 script，可能会阻塞解析，资源加载顺序也会影响首屏速度。"
              ]
            }
          ]
        },
        {
          category: "浏览器网络",
          question: "强缓存和协商缓存怎么区分？",
          summary: "性能优化常见追问题。",
          answer: [
            {
              title: "区别",

      const categories = ["全部", ...new Set(questions.map((item) => item.category))];
      let activeCategory = "全部";
      let keyword = "";

      const board = document.getElementById("questionBoard");
      const chips = document.getElementById("categoryChips");
      const searchInput = document.getElementById("searchInput");
      const visibleCount = document.getElementById("visibleCount");
      const questionTotal = document.getElementById("questionTotal");

      questionTotal.textContent = String(questions.length);

      function createAnswerBlock(block) {
        if (block.type === "paragraph") {
          return `<section><h3>${block.title}</h3><p>${block.content}</p></section>`;
        }

        if (block.type === "list") {
          const items = block.items.map((item) => `<li>${item}</li>`).join("");
          return `<section><h3>${block.title}</h3><ul>${items}</ul></section>`;
        }

        return "";
      }

      function renderChips() {
        chips.innerHTML = categories
          .map(
            (item) => `
              <button
                class="chip ${item === activeCategory ? "active" : ""}"
                type="button"
                data-category="${item}"
              >
                ${item}
              </button>
            `
          )
          .join("");

        chips.querySelectorAll(".chip").forEach((button) => {
          button.addEventListener("click", () => {
            activeCategory = button.dataset.category;
            renderChips();
            renderQuestions();
          });
        });
      }

      function getFilteredQuestions() {
        const normalized = keyword.trim().toLowerCase();

        return questions.filter((item) => {
          const matchCategory = activeCategory === "全部" || item.category === activeCategory;
          const haystack = [item.category, item.question, item.summary]
            .join(" ")
            .toLowerCase();
          const matchKeyword = !normalized || haystack.includes(normalized);

          return matchCategory && matchKeyword;
        });
      }

      function renderQuestions() {
        const filtered = getFilteredQuestions();
        visibleCount.textContent = `显示 ${filtered.length} / ${questions.length}`;

        if (!filtered.length) {
          board.innerHTML = `
            <div class="empty-state">
              没有找到匹配的题目。<br />
              你可以换个关键词试试，或者切回“全部”分类。
            </div>
          `;
          return;
        }

        board.innerHTML = filtered
          .map(
            (item, index) => `
              <article class="card">
                <div class="card-head">
                  <span class="tag">${item.category}</span>
                  <span class="index">题目 ${index + 1}</span>
                </div>
                <button class="question-button" type="button" aria-expanded="false">
                  <div>
                    <div class="question-title">${item.question}</div>
                    <div class="question-meta">${item.summary}</div>
                  </div>
                  <span class="arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                      <path
                        d="M6 9L12 15L18 9"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                      />
                    </svg>
                  </span>
                </button>
                <div class="answer-wrap">
                  <div class="answer">
                    ${item.answer.map(createAnswerBlock).join("")}
                  </div>
                </div>
              </article>
            `
          )
          .join("");

        bindAccordion();
      }

      function bindAccordion() {
        const cards = board.querySelectorAll(".card");

        cards.forEach((card) => {
          const button = card.querySelector(".question-button");
          const wrap = card.querySelector(".answer-wrap");
          const inner = card.querySelector(".answer");

          button.addEventListener("click", () => {
            const isOpen = card.classList.contains("open");

            if (isOpen) {
              wrap.style.height = `${inner.scrollHeight}px`;
              requestAnimationFrame(() => {
                wrap.style.height = "0px";
              });
              card.classList.remove("open");
              button.setAttribute("aria-expanded", "false");
              return;
            }

            wrap.style.height = `${inner.scrollHeight}px`;
            card.classList.add("open");
            button.setAttribute("aria-expanded", "true");

            const onTransitionEnd = (event) => {
              if (event.propertyName !== "height") {
                return;
              }
              if (card.classList.contains("open")) {
                wrap.style.height = "auto";
              }
              wrap.removeEventListener("transitionend", onTransitionEnd);
            };

            wrap.addEventListener("transitionend", onTransitionEnd);
          });
        });
      }

      searchInput.addEventListener("input", (event) => {
        keyword = event.target.value;
        renderQuestions();
      });

      renderChips();
      renderQuestions();
    </script>
